  Licensed under the <a href="https://github.com/startreedata/metabase-pinot-driver/blob/main/LICENSE">Apache License 2.0</a>.
  Maintained by <a href="https://startree.ai">StarTree</a>.

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Makefile
  - package.json
  - node_modules/
  - drivers/
  - scripts/
